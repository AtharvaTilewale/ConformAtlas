name: ICR image

# Builds the ConformAtlas container image, smoke-tests it on the bundled demo
# trajectories, scans it with Trivy, and pushes it to the ICE Cloud Container
# Repository (ICR).
#
# One-time setup: Settings > Secrets and variables > Actions > New repository
# secret, name ICR_CLI_SECRET, value = the CLI secret from
# icecloud.in > Repository > Projects > ICR Credentials.
#
# Run: Actions > ICR image > Run workflow. It also rebuilds monthly so Debian
# security fixes reach the image without a manual run.
#
# Tags pushed: <version>-<build> (never overwritten), plus <version> and latest
# which always point at the newest build.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "ConformAtlas release on PyPI to package"
        required: true
        default: "1.0.3"
      project:
        description: "ICR project to push to"
        required: true
        default: "private"
        type: choice
        options: [private, public]
      base_image:
        description: "Base image pinned by digest (python:3.11-slim@sha256:...). Empty = resolve current python:3.11-slim"
        required: false
        default: ""
  schedule:
    - cron: "17 3 1 * *"   # 03:17 UTC on the 1st of every month

permissions:
  contents: read

env:
  REGISTRY: registry.icecloud.in
  ICR_USER: atharva16atgbu
  BASE_TAG: python:3.11-slim
  TRIVY_IMAGE: aquasec/trivy:0.72.0

jobs:
  build-test-push:
    runs-on: ubuntu-latest
    env:
      IMAGE: registry.icecloud.in/atharva16atgbu-${{ inputs.project || 'private' }}/conformatlas
      VERSION: ${{ inputs.version || '1.0.3' }}
      BUILD_TAG: ${{ inputs.version || '1.0.3' }}-${{ github.run_number }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check that the registry is reachable from GitHub
        run: |
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 "https://${REGISTRY}/v2/" || true)
          echo "registry answered HTTP ${code}"
          # 401 is the normal answer for an unauthenticated Docker registry.
          if [ "$code" != "401" ] && [ "$code" != "200" ]; then
            echo "::error::${REGISTRY} is not reachable from GitHub-hosted runners (HTTP ${code})."
            exit 1
          fi

      - name: Pin the base image digest
        env:
          BASE_INPUT: ${{ inputs.base_image }}
        run: |
          if [ -n "$BASE_INPUT" ]; then
            base="$BASE_INPUT"
          else
            digest=$(docker buildx imagetools inspect "${BASE_TAG}" --format '{{json .Manifest}}' | jq -r .digest)
            base="${BASE_TAG}@${digest}"
          fi
          case "$base" in *@sha256:*) ;; *) echo "::error::base image is not pinned by digest: $base"; exit 1;; esac
          echo "BASE_IMAGE=$base" >> "$GITHUB_ENV"
          echo "::notice title=Base image::$base"

      - name: Build image
        run: |
          docker build \
            --pull \
            --build-arg BASE_IMAGE="${BASE_IMAGE}" \
            --build-arg CONFORMATLAS_VERSION="${VERSION}" \
            -t "${IMAGE}:${BUILD_TAG}" -t "${IMAGE}:${VERSION}" -t "${IMAGE}:latest" .
          docker image ls "${IMAGE}"

      - name: Smoke test on the demo trajectories
        run: |
          docker run --rm "${IMAGE}:${BUILD_TAG}" conformatlas --version
          docker run --rm "${IMAGE}:${BUILD_TAG}" conformatlas doctor
          # Mimic an ICE Cloud private drive: owned by 100:100, mode 755.
          mkdir -p drive && sudo chown 100:100 drive && sudo chmod 755 drive
          docker run --rm -v "$PWD/examples/demo_dataset:/demo:ro" -v "$PWD/drive:/drive/user" "${IMAGE}:${BUILD_TAG}" \
            sh -c 'conformatlas -q analyze -s /demo/WT/topology.pdb -f /demo/WT/rep1.xtc -f /demo/WT/rep2.xtc -T 300 -o /drive/user/out && test -s /drive/user/out/report.html && echo "report.html written to drive OK"'
          sudo rm -rf drive
          # tini must forward SIGTERM so instances stop promptly
          cid=$(docker run -d "${IMAGE}:${BUILD_TAG}")
          start=$(date +%s); docker stop -t 20 "$cid" >/dev/null; took=$(( $(date +%s) - start ))
          echo "container stopped in ${took}s"
          [ "$took" -lt 10 ] || { echo "::error::container ignored SIGTERM (${took}s to stop)"; exit 1; }

      - name: Vulnerability scan (full report)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "${TRIVY_IMAGE}" \
            image --quiet --format table --severity HIGH,CRITICAL "${IMAGE}:${BUILD_TAG}" | tee trivy-report.txt
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "${TRIVY_IMAGE}" \
            image --quiet --format json "${IMAGE}:${BUILD_TAG}" > trivy-report.json
          jq -r '
            [.Results[]?.Vulnerabilities[]?] as $v
            | "total=\($v|length) fixable=\([$v[]|select(.FixedVersion != null and .FixedVersion != "")]|length) "
              + "critical=\([$v[]|select(.Severity=="CRITICAL")]|length) high=\([$v[]|select(.Severity=="HIGH")]|length)"
          ' trivy-report.json | tee trivy-summary.txt
          echo "::notice title=Trivy::$(cat trivy-summary.txt)"

      - name: Vulnerability gate (fixable HIGH/CRITICAL)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "${TRIVY_IMAGE}" \
            image --quiet --ignore-unfixed --severity HIGH,CRITICAL --exit-code 1 "${IMAGE}:${BUILD_TAG}"

      - name: Upload scan reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-${{ env.BUILD_TAG }}
          path: trivy-*
          if-no-files-found: ignore

      - name: Log in to ICR
        env:
          ICR_CLI_SECRET: ${{ secrets.ICR_CLI_SECRET }}
        run: |
          if [ -z "$ICR_CLI_SECRET" ]; then
            echo "::error::Repository secret ICR_CLI_SECRET is not set."
            exit 1
          fi
          echo "$ICR_CLI_SECRET" | docker login "${REGISTRY}" -u "${ICR_USER}" --password-stdin

      - name: Push image
        run: |
          docker push "${IMAGE}:${BUILD_TAG}"
          docker push "${IMAGE}:${VERSION}"
          docker push "${IMAGE}:latest"
          {
            echo "Pushed \`${IMAGE}:${BUILD_TAG}\` (also tagged \`${VERSION}\` and \`latest\`)"
            echo ""
            echo "Base image: \`${BASE_IMAGE}\`"
            echo ""
            echo "Trivy: $(cat trivy-summary.txt)"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=Pushed::${IMAGE}:${BUILD_TAG}"

      - name: Log out
        if: always()
        run: docker logout "${REGISTRY}" || true
